<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stepper Sum</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .row {
      margin-bottom: 15px;
    }

    button {
      width: 30px;
      height: 30px;
      font-size: 18px;
      cursor: pointer;
    }

    input[type="number"] {
      width: 80px;
      text-align: center;
      margin: 0 5px;
    }
  </style>
</head>
<body>

  <div class="row">
    <button onclick="changeValue('num1', -1)">−</button>
    <input type="number" id="num1" value="0" readonly>
    <button onclick="changeValue('num1', 1)">+</button>
  </div>

  <div class="row">
    <button onclick="changeValue('num2', -1)">−</button>
    <input type="number" id="num2" value="0" readonly>
    <button onclick="changeValue('num2', 1)">+</button>
  </div>

  <div class="row">
    <strong>Sum:</strong>
    <input type="number" id="sum" value="0" readonly>
  </div>

  <script>
    function changeValue(id, delta) {
      const input = document.getElementById(id);
      input.value = Number(input.value) + delta;
      updateSum();
    }

    function updateSum() {
      const a = Number(document.getElementById("num1").value);
      const b = Number(document.getElementById("num2").value);
      document.getElementById("sum").value = a + b;
    }
  </script>

</body>
</html>
