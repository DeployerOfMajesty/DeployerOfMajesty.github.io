<!DOCTYPE html>
<html lang="en">
  <!-- I like to run this through the html parser at https://prettier.io/playground/ -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SATOR Calculator</title>

    <style>
      body {
        display: flex;
        justify-content: center;
        font-family: sans-serif;
        padding: 16px;
        font-size: 1.2rem;
        touch-action: manipulation;
      }

      .calculator {
        width: max-content;
      }

      .title {
        text-align: center;
        margin-bottom: 16px;
        font-size: 1.3rem;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        margin-bottom: 16px;
      }

      .summary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .choice {
        width: 74px;
        height: 48px;
        font-size: 0.95rem;
        line-height: 1;
        border: 2px solid #ccc;
        background: #f5f5f5;
        white-space: nowrap;
      }

      .choice.active {
        background: #333;
        color: white;
        border-color: #ccc;
      }

      .choice-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .label {
        width: 32px;
        text-align: right;
        flex-shrink: 0;
      }

      button {
        width: 48px;
        height: 48px;
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      input[type="number"] {
        width: 90px;
        font-size: 1.2rem;
        text-align: center;
      }

      #sum {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <div class="title">
        <strong>SATOR Calculator</strong>
      </div>

      <div class="row">
        <strong class="label">S</strong>
        <input type="number" class="num" value="0" readonly />
        <button onclick="changeValue(0, 1)">+</button>
        <button onclick="changeValue(0, -1)">−</button>
      </div>

      <div class="row">
        <strong class="label">A</strong>
        <input type="number" class="num" value="0" readonly />
        <button onclick="changeValue(1, 1)">+</button>
        <button onclick="changeValue(1, -1)">−</button>
      </div>

      <div class="row">
        <strong class="label">T</strong>
        <input type="number" class="num" value="0" readonly />
        <button onclick="changeValue(2, 1)">+</button>
        <button onclick="changeValue(2, -1)">−</button>
      </div>

      <div class="row">
        <strong class="label">O</strong>
        <input type="number" class="num" value="0" readonly />
        <button onclick="changeValue(3, 1)">+</button>
        <button onclick="changeValue(3, -1)">−</button>
      </div>

      <div class="row fixed-row" data-index="4" data-default="0">
        <strong class="label">R</strong>
        <input type="number" class="num" value="0" readonly />
        <div class="choice-group">
          <button class="choice active" data-value="0">Close</button>
          <button class="choice" data-value="2">Medium</button>
          <button class="choice" data-value="4">Long</button>
        </div>
      </div>
      <div class="summary">
        <strong>Sum</strong>
        <input type="number" id="sum" value="0" readonly />
        <button onclick="resetAll()">🔄</button>
      </div>
    </div>
    <script>
      const inputs = document.querySelectorAll(".num");
      const sumOutput = document.getElementById("sum");

      function changeValue(index, delta) {
        if (navigator.vibrate) navigator.vibrate(10);
        inputs[index].value = Math.max(0, Number(inputs[index].value) + delta);
        updateSum();
      }

      function updateSum() {
        let total = 0;
        inputs.forEach((input) => {
          total += Number(input.value);
        });
        sumOutput.value = total;
      }

      function resetAll() {
        // Reset numeric inputs
        inputs.forEach((input) => {
          input.value = 0;
        });

        //Reset fixed-choice rows to their defaults
        document.querySelectorAll(".fixed-row").forEach((row) => {
          const index = Number(row.dataset.index);
          const defaultValue = Number(row.dataset.default);
          const buttons = row.querySelectorAll(".choice");
          inputs[index].value = defaultValue;
          buttons.forEach((button) => {
            button.classList.toggle(
              "active",
              Number(button.dataset.value) === defaultValue,
            );
          });
        });
        updateSum();
      }

      document.querySelectorAll(".fixed-row").forEach((row) => {
        const index = Number(row.dataset.index);
        const buttons = row.querySelectorAll(".choice");
        const input = inputs[index];

        buttons.forEach((button) => {
          button.addEventListener("click", () => {
            if (navigator.vibrate) navigator.vibrate(10);

            input.value = Number(button.dataset.value);

            buttons.forEach((b) => b.classList.remove("active"));
            button.classList.add("active");

            updateSum();
          });
        });
      });
    </script>
  </body>
</html>
