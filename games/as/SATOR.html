<!DOCTYPE html>
<html lang="en">
  <!-- I like to run this through the html parser at https://prettier.io/playground/ -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SATOR Calculator</title>

    <style>
      body {
        display: flex;
        justify-content: center;
        font-family: sans-serif;
        padding: 16px;
        font-size: 1.2rem;
        touch-action: manipulation;
      }

      .calculator {
        width: max-content;
      }

      .title {
        text-align: center;
        margin-bottom: 16px;
        font-size: 1.3rem;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        margin-bottom: 16px;
      }

      .summary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .choice {
        width: 74px;
        height: 48px;
        font-size: 0.95rem;
        line-height: 1;
        border: 2px solid #ccc;
        background: #f5f5f5;
        white-space: nowrap;
      }

      .choice.active {
        background: #333;
        color: white;
        border-color: #ccc;
      }

      .choice-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .choice-select {
        height: 48px;
        font-size: 1rem;
        padding: 4px 8px;
      }

      .label {
        width: 32px;
        text-align: right;
        flex-shrink: 0;
      }

      button {
        width: 48px;
        height: 48px;
        font-size: 1.5rem;
        line-height: 1;
        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      output {
        width: 3ch;
        min-width: 3ch;
        font-size: 1.2rem;
        text-align: center;
      }

      #sum {
        font-weight: bold;
        width: 3ch;
        min-width: 3ch;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <div class="title">
        <strong>SATOR Calculator</strong>
      </div>

      <div class="row" data-index="0" data-default="4">
        <strong class="label">S</strong>
        <output class="value">4</output>
        <button onclick="changeValue(0, 1)">+</button>
        <button onclick="changeValue(0, -1)">−</button>
      </div>

      <div class="row" data-index="1" data-default="0">
        <strong class="label">A</strong>
        <output class="value">0</output>
        <button onclick="changeValue(1, 1)">+</button>
        <button onclick="changeValue(1, -1)">−</button>
      </div>

      <div class="row" data-index="2" data-default="1">
        <strong class="label">T</strong>
        <output class="value">1</output>
        <button onclick="changeValue(2, 1)">+</button>
        <button onclick="changeValue(2, -1)">−</button>
      </div>

      <div class="row" data-index="3" data-default="0">
        <strong class="label">O</strong>
        <output class="value">0</output>
        <button onclick="changeValue(3, 1)">+</button>
        <button onclick="changeValue(3, -1)">−</button>
      </div>

      <div class="row fixed-row" data-index="4" data-default="2">
        <strong class="label">R</strong>
        <output class="value">0</output>
        <select class="choice-select">
          <option value="0">Short</option>
          <option value="2">Medium</option>
          <option value="4">Long</option>
          <option value="6">Extreme</option>
          <option value="8">Horizon</option>
        </select>
      </div>
      <div class="summary">
        <strong>Sum</strong>
        <output id="sum">0</output>
        <button onclick="resetAll()">🔄</button>
      </div>
    </div>
    <script>
      const values = document.querySelectorAll(".value");
      const sumOutput = document.getElementById("sum");

      document.querySelectorAll(".row").forEach((row) => {
        const defaultValue = row.dataset.default;
        if (defaultValue === undefined) return;

        const valueEl = row.querySelector(".value");
        valueEl.textContent = defaultValue;

        const select = row.querySelector(".choice-select");
        if (select) {
          select.value = defaultValue;
        }
      });

      updateSum();

      function changeValue(index, delta) {
        if (navigator.vibrate) navigator.vibrate(10);
        values[index].textContent = Math.max(
          0,
          Number(values[index].textContent) + delta,
        );
        updateSum();
      }

      function updateSum() {
        let total = 0;
        values.forEach((valueEl) => {
          total += Number(valueEl.textContent);
        });
        sumOutput.textContent = total;
      }

      function resetAll() {
        document.querySelectorAll(".row").forEach((row) => {
          const defaultValue = row.dataset.default;
          if (defaultValue === undefined) return;

          row.querySelector(".value").textContent = defaultValue;

          const select = row.querySelector(".choice-select");
          if (select) {
            select.value = defaultValue;
          }
        });

        updateSum();
      }

      document.querySelectorAll(".fixed-row").forEach((row) => {
        const index = Number(row.dataset.index);
        const valueEl = values[index];
        const select = row.querySelector(".choice-select");

        select.value = row.dataset.default;
        valueEl.textContent = row.dataset.default;

        select.addEventListener("change", () => {
          if (navigator.vibrate) navigator.vibrate(10);
          valueEl.textContent = Number(select.value);
          updateSum();
        });
      });
    </script>
  </body>
</html>
