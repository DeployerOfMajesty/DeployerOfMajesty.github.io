<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Five Number Sum</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .row {
      margin-bottom: 12px;
    }

    button {
      width: 30px;
      height: 30px;
      font-size: 18px;
      cursor: pointer;
    }

    input[type="number"] {
      width: 80px;
      text-align: center;
      margin: 0 5px;
    }
  </style>
</head>
<body>

  <div class="row">
    <button onclick="changeValue(0, -1)">−</button>
    <input type="number" class="num" value="0" readonly>
    <button onclick="changeValue(0, 1)">+</button>
  </div>

  <div class="row">
    <button onclick="changeValue(1, -1)">−</button>
    <input type="number" class="num" value="0" readonly>
    <button onclick="changeValue(1, 1)">+</button>
  </div>

  <div class="row">
    <button onclick="changeValue(2, -1)">−</button>
    <input type="number" class="num" value="0" readonly>
    <button onclick="changeValue(2, 1)">+</button>
  </div>

  <div class="row">
    <button onclick="changeValue(3, -1)">−</button>
    <input type="number" class="num" value="0" readonly>
    <button onclick="changeValue(3, 1)">+</button>
  </div>

  <div class="row">
    <button onclick="changeValue(4, -1)">−</button>
    <input type="number" class="num" value="0" readonly>
    <button onclick="changeValue(4, 1)">+</button>
  </div>

  <div class="row">
    <strong>Sum:</strong>
    <input type="number" id="sum" value="0" readonly>
  </div>

  <script>
    const inputs = document.querySelectorAll(".num");
    const sumOutput = document.getElementById("sum");

    function changeValue(index, delta) {
      inputs[index].value = Number(inputs[index].value) + delta;
      updateSum();
    }

    function updateSum() {
      let total = 0;
      inputs.forEach(input => {
        total += Number(input.value);
      });
      sumOutput.value = total;
    }
  </script>

</body>
</html>
